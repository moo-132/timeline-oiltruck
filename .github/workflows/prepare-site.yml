name: Prepare Timeline Oil Truck site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/prepare-site.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original site source is present
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::Missing site/index.html. Import the original Timeline Oil Truck source before packaging."
            exit 1
          fi
      - name: Validate site and unload fallback contract
        run: |
          node scripts/validate-site.mjs
      - name: Package site (not a public deploy)
        uses: actions/upload-artifact@v4
        with:
          name: timeline-oiltruck-site
          path: site/
          if-no-files-found: error
          retention-days: 7
