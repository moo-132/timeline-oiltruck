name: Deploy Timeline Oil Truck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "check.cjs"
      - "test-sheet.cjs"
      - "test-export-grid.cjs"
      - "test-pcu.cjs"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source and JavaScript syntax
        run: |
          test -f dist/index.html
          node --check dist/logic.js
          node --check dist/sheet-live.js
          node --check dist/timeline.js
          node --check dist/pcu.js
          node --check dist/pcu-chart.js
          node --check tests/browser-pcu.cjs
      - name: Verify vehicle rounds
        run: node check.cjs
      - name: Verify Google Sheets feed parsing
        run: node test-sheet.cjs
      - name: Verify hourly grid survives PNG export
        run: node test-export-grid.cjs
      - name: Verify PCU hourly road traffic against real Sheets data
        run: node test-pcu.cjs
      - name: Install browser smoke-test dependencies
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0 html2canvas@1.4.1
      - name: Test SVG PCU graph, date switching and PNG export in Chrome
        run: node tests/browser-pcu.cjs
      - name: Upload browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcu-browser-verification
          path: |
            tests/pcu-browser.png
            tests/pcu-export.png
            tests/timeline-only-export.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Disable Jekyll processing for static files
        run: touch dist/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
