name: Deploy Timeline Oil Truck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "check.cjs"
      - "test-sheet.cjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source and JavaScript syntax
        run: |
          test -f dist/index.html
          node --check dist/logic.js
          node --check dist/sheet-live.js
          node --check dist/timeline.js
      - name: Verify vehicle rounds
        run: node check.cjs
      - name: Verify Google Sheets feed parsing
        run: node test-sheet.cjs
      - name: Disable Jekyll processing for static files
        run: touch dist/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
